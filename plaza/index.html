<!--
============================================================
Página de INICIO · Sabores de la Plaza
Ejercicios 01, 02, 03, 07 y 08
============================================================
Sabores de la Plaza es un colectivo de puestos de una plaza de
mercado: fruteros, panadería, almuerzos, jugos naturales y café.
Quieren un sitio de tres páginas: index.html (esta), puestos.html
y contacto.html. Escribe tu HTML DEBAJO de este comentario.
Todo con Bootstrap: nada de JavaScript propio.

Ejercicio 01 · Bootstrap instalado (en las TRES páginas)
  - El esqueleto de siempre, con el <meta name="viewport">.
  - En el <head>: el CSS de Bootstrap 5 (cópialo de la documentación)
    y DESPUÉS tu <link href="styles.css" rel="stylesheet">.
  - Al final del <body>: el <script> de bootstrap.bundle.min.js.

Ejercicio 02 · Barra de navegación (idéntica en las TRES páginas)
  - Una navbar con navbar-expand-lg, la marca "Sabores de la Plaza"
    (clase navbar-brand) y el botón navbar-toggler para el celular.
  - El data-bs-target del botón apunta al id del div collapse.
  - Enlaces a index.html, puestos.html y contacto.html.

Ejercicio 03 · La bienvenida (solo en esta página)
  - Un banner (hero) con el único <h1> de esta página, una frase y un
    botón (clase btn) que lleve a puestos.html o a contacto.html.
  - Una fila con 3 o 4 bloques de presentación (fresco, local,
    hecho a mano…): uno debajo del otro en el celular y todos en
    una sola fila en el computador.
  - Un <footer> con los datos del colectivo.

Ejercicio 07 · El carrusel (aquí o en puestos.html)
  - El cliente quiere "fotos que pasen solas". Búscalo en
    Components → Carousel. Al menos 3 fotos, cada una con alt.
  - En plaza/img/ tienes 3 imágenes listas para usar.

Ejercicio 08 · La letra (en las TRES páginas)
  - El <link> de Google Fonts con tu fuente, en el <head>.
============================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabores de la Plaza</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#inicio">
        <i class="bi bi-cup-hot-fill"></i> Sabores de la Plaza
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
          <li class="nav-item"><a class="nav-link" href="puestos.html">Puestos</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header id="inicio" class="bg-primary text-white text-center py-5">
    <div class="container py-lg-5">
      <p >Encuentra los mejores sabores del campo Colombiano</p>
      <h1 class="display-5 fw-bold"> Ven a Sabores de la plaza</h1>
      <a href="puestos.html" class="btn btn-light btn-lg m-1">Mirar comercios</a>
    </div>
  </header>
  
  <main>
    <section>
    <div class="container overflow-hidden text-center">
      <div class="row gx-5">
        <div class="col-12 col-md-4">
          <div class="p-3 border bg-light">Fresco</div>
        </div>
        <div class="col-12 col-md-4">
          <div class="p-3 border bg-light">Local</div>
        </div>
        <div class="col-12 col-md-4">
          <div class="p-3 border bg-light">Hecho a mano</div>
        </div>
      </div>
    </div>
    </section>


    <section>
      <div id="carouselExampleFade" class="carousel carousel-fade" data-bs-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="img/cafe.svg" class="d-block w-100 rounded-5" alt="cafe">
          </div>
          <div class="carousel-item">
            <img src="img/frutas.svg" class="d-block w-100 rounded-5" alt="frutas">
          </div>
          <div class="carousel-item">
            <img src="img/pan.svg" class="d-block w-100 rounded-5" alt="pan">
          </div>
        </div>
        <div>
          <button class="btn-icon" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="prev">
            <span class="carousel-icon-prev" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="btn-icon" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="next">
            <span class="carousel-icon-next" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
       </div>
      </div>




    </section>
  </main>



  <footer class="bg-dark text-white py-4">
    <div class="container text-center d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
      <p class="mb-0">© 2026 Sabores de la Plaza · Encuentra los mejores sabores del campo Colombiano</p>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</body>

</html>
